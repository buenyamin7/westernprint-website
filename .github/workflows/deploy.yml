name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Volle git-Historie: src/lib/lastmod.mjs liest daraus lastmod, dateModified und die Stand-Zeile.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: dist/sitemap-0.xml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Volle Historie: ein Push kann mehrere Commits enthalten, gemeldet wird der ganze Bereich.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sitemap
      - name: Geänderte Seiten an Bing melden (IndexNow)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sleep 60
          # Alle Commits dieses Pushs (before..HEAD). Ohne gültiges before (erster Push, manueller Start) nur der letzte Commit.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="$BEFORE"
          else
            RANGE="HEAD~1"
          fi
          node scripts/indexnow.mjs sitemap-0.xml $(git diff --name-only "$RANGE" HEAD 2>/dev/null)
        continue-on-error: true
